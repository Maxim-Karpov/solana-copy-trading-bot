[package]
name = "fastpath"
version = "0.2.1"
edition = "2021"
description = "Rust fast path for the Solana copy-trading bot: shred feed -> decode -> build -> sign -> send"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
curve25519-dalek = "4"
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"
dotenvy = "0.15"
rand = "0.8"
anyhow = "1"

[build-dependencies]
tonic-build = "0.12"
protox = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
